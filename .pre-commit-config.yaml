# pre-commit configuration
# https://pre-commit.com
#
# Run manually:   pre-commit run --all-files
# Install hooks:  pre-commit install
# Update hooks:   pre-commit autoupdate
#
# Hooks that auto-fix files re-stage the modified files automatically via the
# wrapper in .githooks/pre-commit.

repos:
  # ── General file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]     # allow custom YAML tags
      - id: check-json
        # Zed settings and keymaps are JSONC so their intent stays documented.
        exclude: '^dotfiles/\.config/zed/(settings|keymap)\.json$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: check-executables-have-shebangs

  # ── Shell scripts ────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, -x, --source-path=SCRIPTDIR]
        # shellcheck has no zsh support and flags these as broken bash.
        # linux/scripts/test.sh syntax-checks them with `zsh -n` instead.
        exclude: '^dotfiles/\.(zshrc|zshenv|zprofile|p10k\.zsh)$'

  # ── Python: ruff (lint + auto-fix) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── YAML ─────────────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, "{extends: relaxed, rules: {line-length: {max: 120}}}"]

  # ── Lua (for neovim config) ──────────────────────────────────────────────────
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.0.2
    hooks:
      - id: stylua
        args: [--verify]
        types: [file]
        files: \.lua$

  # ── Secrets ─────────────────────────────────────────────────────────────────
  # instructions.md tells every agent "never commit secrets". This is what
  # actually enforces it: detect-private-key above only catches key files,
  # not tokens pasted into source.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # Would have caught the bash-4 mapfile in macos-ci.yml before CI did.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
