name: macOS CI

# The mac/ scripts and the shared code they depend on had no CI at all, so a
# macOS-only breakage (a removed `brew bundle` flag, say) only ever surfaced by
# running the bootstrap by hand.
#
# This job deliberately does NOT run the full bootstrap: installing every cask
# in the Brewfile would take far too long on a hosted runner. It checks the
# things that can be checked statically, plus the steps that are safe to run
# for real on a throwaway machine.

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - 'dotfiles/**'
      - 'shared/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'mac/**'
      - 'dotfiles/**'
      - 'shared/**'
      - 'packages/**'

defaults:
  run:
    working-directory: mac

jobs:
  static-checks:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: brew install shellcheck

      # git ls-files prints repo-root-relative paths, so these run from the
      # repo root rather than the mac/ working-directory default.
      - name: bash -n
        working-directory: .
        run: |
          while IFS= read -r f; do bash -n "$f"; done < <(
            git ls-files 'mac/*.sh' 'shared/*.sh'
          )

      - name: shellcheck
        working-directory: .
        run: |
          # No mapfile here: GitHub's macOS runners use /bin/bash, which is
          # bash 3.2, and mapfile is a bash 4 builtin.
          git ls-files 'mac/*.sh' 'shared/*.sh' \
            | xargs shellcheck -x --source-path=SCRIPTDIR

      # macOS ships bash 3.2 (2007). The bootstrap entry point, the git hooks,
      # and anything they invoke MUST work under it,
      # otherwise ./run.sh cannot bootstrap the machine it is meant to
      # bootstrap. This job runs under that same bash 3.2, so it is the right
      # place to catch bash 4+ syntax creeping back in.
      - name: bash 3.2 compatibility (anything that runs on macOS)
        working-directory: .
        run: |
          echo "checking with: $(bash --version | head -1)"
          # mapfile/readarray and ${var^^}/${var,,} and declare -A are bash 4;
          # the auto-allocating `exec {fd}>&1` form is bash 4.1.
          #
          # Comment lines are skipped: several of these constructs are named in
          # comments precisely to explain why they are avoided.
          pattern='(^|[^[:alnum:]_])(mapfile|readarray)[[:space:]]'
          pattern="$pattern"'|\$\{[A-Za-z_][A-Za-z0-9_]*(\^\^|,,)\}'
          pattern="$pattern"'|exec[[:space:]]+\{[A-Za-z_]'
          pattern="$pattern"'|(declare|local)[[:space:]]+-A[[:space:]]'

          fail=0
          while IFS= read -r f; do
            hits="$(grep -vE '^[[:space:]]*#' "$f" | grep -nE "$pattern" || true)"
            if [ -n "$hits" ]; then
              echo "::error file=$f::uses bash 4+ syntax but must run on stock macOS bash 3.2"
              echo "$hits"
              fail=1
            fi
          done < <(git ls-files 'mac/*.sh' 'shared/*.sh' 'scripts/*.sh' \
                     'install.sh' '.githooks/pre-commit' '.githooks/pre-push' \
                     'linux/scripts/test.sh')
          exit $fail

      - name: zsh -n (zsh dotfiles)
        working-directory: .
        run: |
          for f in dotfiles/.zshenv dotfiles/.zshrc dotfiles/.zprofile; do
            zsh -n "$f"
          done

      - name: Brewfile is valid
        run: brew bundle list --file=Brewfile >/dev/null

      # `brew bundle list` only parses the file. This asks Homebrew whether
      # each entry still exists, is the declared kind, and has not been
      # renamed upstream -- the failure that aborts a fresh machine's system
      # step partway through. Metadata only; nothing is installed.
      - name: Brewfile entries resolve against Homebrew
        working-directory: .
        run: bash mac/scripts/check-brewfile.sh

      - name: run.sh --help
        run: ./run.sh --help

  bootstrap:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Steps that are safe and quick on a hosted runner. The system step is
      # skipped: it would install the full Brewfile including GUI casks.
      - name: Dotfiles bootstrap
        run: ./run.sh --only dotfiles

      - name: Configure (non-interactive, identity from env)
        env:
          MACHINIST_GIT_NAME: CI Runner
          MACHINIST_GIT_EMAIL: ci@example.com
        run: ./run.sh --only configure

      - name: Git identity was actually written
        run: |
          test "$(git config --file ~/.gitconfig.local user.email)" = "ci@example.com"

      # Install antidote and powerlevel10k so the startup budget below is
      # measured against a REALLY configured shell. Without this the measured
      # zsh has no plugins and no prompt, and the number is a meaningless floor.
      - name: Shell bootstrap (plugins + prompt)
        run: ./run.sh --only shell

      - name: Agents bootstrap
        run: ./run.sh --only agents

      - name: Shared instructions reach supported agents
        run: |
          test -L ~/.claude/CLAUDE.md
          test -L ~/.codex/AGENTS.md


      # Startup speed is a stated goal, so measure it on the real target OS
      # rather than trusting a number measured on a laptop. Budgets are
      # generous: this is here to catch a regression (an uncached eval, an
      # eagerly loaded plugin), not to police milliseconds on a shared runner.
      - name: Shell startup budget
        run: |
          set -e
          measure() {
            best=99
            for _ in 1 2 3 4 5; do
              t=$( { /usr/bin/time -p "$1" -lic 'exit' ; } 2>&1 | awk '/^real/{print $2}' )
              [ -z "$t" ] && continue
              best=$(awk -v a="$t" -v b="$best" 'BEGIN{print (a<b)?a:b}')
            done
            awk -v b="$best" 'BEGIN{printf "%d", b*1000}'
          }
          fail=0
          for shell in zsh bash; do
            command -v "$shell" >/dev/null 2>&1 || continue
            ms=$(measure "$shell")
            budget=$([ "$shell" = zsh ] && echo 400 || echo 500)
            echo "$shell startup: ${ms}ms (budget ${budget}ms)"
            if [ "$ms" -gt "$budget" ]; then
              echo "::error::$shell startup ${ms}ms exceeds the ${budget}ms budget"
              fail=1
            fi
          done
          exit $fail

      - name: Verify (report only; a bare runner will not pass everything)
        run: ./run.sh --verify || true
